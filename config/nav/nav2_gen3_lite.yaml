/**:
  bt_navigator:
    ros__parameters:
      global_frame: $(var namespace)/map
      robot_base_frame: $(var namespace)/base_footprint
      odom_topic: /$(var namespace)/odom
      default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
      bt_loop_duration: 10
      default_server_timeout: 50
      enable_groot_monitoring: true
      groot_zmq_publisher_port: 1666
      groot_zmq_server_port: 1667

  controller_server:
    ros__parameters:
      controller_frequency: 10.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3

      progress_checker_plugin: "progress_checker"
      goal_checker_plugins: ["general_goal_checker"]
      controller_plugins: ["FollowPath"]

      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.15
        movement_time_allowance: 12.0

      general_goal_checker:
        stateful: true
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.15
        yaw_goal_tolerance: 0.25

      FollowPath:
        plugin: "dwb_core::DWBLocalPlanner"
        debug_trajectory_details: false

        acc_lim_x: 0.3
        acc_lim_y: 0.3
        acc_lim_theta: 1.2

        decel_lim_x: -0.5
        decel_lim_y: -0.5
        decel_lim_theta: -1.5

        min_vel_x: -0.3
        max_vel_x: 0.5
        min_vel_y: -0.3
        max_vel_y: 0.3
        min_speed_xy: 0.0
        max_speed_xy: 0.5

        min_speed_theta: 0.0
        max_speed_theta: 1.2

        sim_time: 2.0
        linear_granularity: 0.05
        angular_granularity: 0.025
        vx_samples: 20
        vy_samples: 10
        vtheta_samples: 20

        critics: [
          "ObstacleFootprint",
          "BaseObstacle",
          "PathAlign",
          "PathDist",
          "GoalAlign",
          "GoalDist",
          "RotateToGoal"
        ]

        ObstacleFootprint.scale: 10.0
        BaseObstacle.scale: 0.02
        PathAlign.scale: 32.0
        PathAlign.forward_point_distance: 0.35
        GoalAlign.scale: 24.0
        GoalAlign.forward_point_distance: 0.35
        PathDist.scale: 32.0
        GoalDist.scale: 24.0
        RotateToGoal.scale: 32.0
        RotateToGoal.slowing_factor: 5.0
        RotateToGoal.lookahead_time: -1.0


  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 10.0
        publish_frequency: 5.0

        global_frame: $(var namespace)/odom
        robot_base_frame: $(var namespace)/base_footprint

        rolling_window: true
        width: 4
        height: 4
        resolution: 0.05

        robot_radius: 0.175

        plugins: ["obstacle_layer", "inflation_layer"]

        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /$(var namespace)/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
            raytrace_max_range: 3.5
            raytrace_min_range: 0.0

        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          inflation_radius: 0.75
          cost_scaling_factor: 2.0
          always_send_full_costmap: false


  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 2.0
        publish_frequency: 1.0

        global_frame: $(var namespace)/map
        robot_base_frame: $(var namespace)/base_footprint

        resolution: 0.05
        track_unknown_space: true
        rolling_window: false

        robot_radius: 0.175

        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: true
          map_topic: /$(var namespace)/map

        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          observation_sources: scan
          scan:
            topic: /$(var namespace)/scan
            clearing: true
            marking: true
            data_type: "LaserScan"
            obstacle_max_range: 2.5
            raytrace_max_range: 3.0

        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          inflation_radius: 1.0
          cost_scaling_factor: 1.75
          always_send_full_costmap: false


  planner_server:
    ros__parameters:
      expected_planner_frequency: 2.0
      planner_plugins: ["GridBased"]

      GridBased:
        plugin: "nav2_smac_planner::SmacPlanner2D"

        tolerance: 0.15
        downsample_costmap: false
        downsampling_factor: 1
        allow_unknown: true

        max_iterations: 1000000
        max_on_approach_iterations: 500
        max_planning_time: 3.0

        smooth_path: true
        motion_model_for_search: "MOORE"

        cost_travel_multiplier: 2.0

        use_final_approach_orientation: false


  behavior_server:
    ros__parameters:
      local_costmap_topic: /$(var namespace)/local_costmap/costmap_raw
      local_footprint_topic: /$(var namespace)/local_costmap/published_footprint
      cycle_frequency: 10.0

      behavior_plugins: ["spin", "backup", "wait"]

      spin:
        plugin: "nav2_behaviors::Spin"
      backup:
        plugin: "nav2_behaviors::BackUp"
      wait:
        plugin: "nav2_behaviors::Wait"

      global_frame: $(var namespace)/odom
      robot_base_frame: $(var namespace)/base_footprint

      transform_timeout: 0.2
      simulate_ahead_time: 2.0

      max_rotational_vel: 0.8
      min_rotational_vel: 0.1
      rotational_acc_lim: 0.8


  waypoint_follower:
    ros__parameters:
      loop_rate: 200
      stop_on_failure: false
      waypoint_task_executor_plugin: "wait_at_waypoint"
      wait_at_waypoint:
        plugin: "nav2_waypoint_follower::WaitAtWaypoint"
        enabled: true
        waypoint_pause_duration: 200