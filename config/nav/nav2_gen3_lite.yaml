/**:
  bt_navigator:
    ros__parameters:
      global_frame: $(var namespace)/map
      robot_base_frame: $(var namespace)/base_footprint
      odom_topic: /$(var namespace)/odom
      default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
      bt_loop_duration: 10
      default_server_timeout: 50
      enable_groot_monitoring: true
      groot_zmq_publisher_port: 1666
      groot_zmq_server_port: 1667

  controller_server:
    ros__parameters:
      controller_frequency: 10.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3

      progress_checker_plugin: "progress_checker"
      goal_checker_plugins: ["general_goal_checker"]
      controller_plugins: ["FollowPath"]

      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.3
        movement_time_allowance: 10.0

      general_goal_checker:
        stateful: true
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.2
        yaw_goal_tolerance: 0.35

      FollowPath:
        plugin: "dwb_core::DWBLocalPlanner"
        debug_trajectory_details: false

        acc_lim_x: 0.8
        acc_lim_y: 0.8
        acc_lim_theta: 1.5

        decel_lim_x: -0.8
        decel_lim_y: -0.8
        decel_lim_theta: -1.5

        min_vel_x: -0.5
        max_vel_x: 0.5
        min_vel_y: -0.5
        max_vel_y: 0.5

        min_speed_xy: 0.0
        max_speed_xy: 0.5

        min_speed_theta: 0.0
        max_speed_theta: 1.5

        sim_time: 1.5
        vx_samples: 15
        vy_samples: 15
        vtheta_samples: 20

        critics: [
          "ObstacleFootprint",
          "BaseObstacle",
          "PathDist",
          "GoalDist"
        ]

        BaseObstacle.scale: 20.0
        ObstacleFootprint.scale: 2.0
        PathDist.scale: 5.0
        GoalDist.scale: 8.0


  local_costmap:
    local_costmap:
      ros__parameters:

        update_frequency: 8.0
        publish_frequency: 4.0

        global_frame: $(var namespace)/odom
        robot_base_frame: $(var namespace)/base_footprint

        rolling_window: true
        width: 3
        height: 3
        resolution: 0.05

        robot_radius: 0.18
        footprint_padding: 0.03

        plugins: ["obstacle_layer", "inflation_layer"]

        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true

          observation_sources: scan

          scan:
            topic: /$(var namespace)/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"

            obstacle_max_range: 2.5
            obstacle_min_range: 0.0

            raytrace_max_range: 3.0
            raytrace_min_range: 0.0

        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          inflation_radius: 0.45
          cost_scaling_factor: 2.5

        always_send_full_costmap: true


  global_costmap:
    global_costmap:
      ros__parameters:

        update_frequency: 2.0
        publish_frequency: 1.0

        global_frame: $(var namespace)/map
        robot_base_frame: $(var namespace)/base_footprint

        resolution: 0.05

        track_unknown_space: true
        rolling_window: false

        robot_radius: 0.20

        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: true
          map_topic: /$(var namespace)/map

        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"

          observation_sources: scan

          scan:
            topic: /$(var namespace)/scan
            clearing: true
            marking: true
            data_type: "LaserScan"

            obstacle_max_range: 2.5
            raytrace_max_range: 3.0

        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          inflation_radius: 0.45
          cost_scaling_factor: 3.0

        always_send_full_costmap: true


  planner_server:
    ros__parameters:

      expected_planner_frequency: 2.0
      planner_plugins: ["GridBased"]

      GridBased:
        plugin: "nav2_smac_planner::SmacPlanner2D"

        tolerance: 0.15
        downsample_costmap: false
        allow_unknown: true

        max_iterations: 1000000
        max_on_approach_iterations: 500

        smooth_path: true

        use_final_approach_orientation: false


  behavior_server:
    ros__parameters:

      local_costmap_topic: /$(var namespace)/local_costmap/costmap_raw
      local_footprint_topic: /$(var namespace)/local_costmap/published_footprint

      cycle_frequency: 10.0

      behavior_plugins: ["spin", "backup", "wait"]

      spin:
        plugin: "nav2_behaviors::Spin"

      backup:
        plugin: "nav2_behaviors::BackUp"

      wait:
        plugin: "nav2_behaviors::Wait"

      global_frame: $(var namespace)/odom
      robot_base_frame: $(var namespace)/base_footprint

      transform_timeout: 0.2
      simulate_ahead_time: 2.0

      max_rotational_vel: 1.0
      min_rotational_vel: 0.1
      rotational_acc_lim: 1.0


  waypoint_follower:
    ros__parameters:

      loop_rate: 200
      stop_on_failure: false

      waypoint_task_executor_plugin: "wait_at_waypoint"

      wait_at_waypoint:
        plugin: "nav2_waypoint_follower::WaitAtWaypoint"
        enabled: true
        waypoint_pause_duration: 200